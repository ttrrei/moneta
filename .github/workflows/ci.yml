name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The results check is the load-bearing job: it is what catches a committed
# matrix that ran outside its declared window (the OOS holdout). It has zero
# dependencies, so it can never be red for an unrelated reason.
jobs:
  results-check:
    name: committed results are legal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: checker self-test (32 mutation cases)
        run: python scripts/test_check_results.py

      # L1 (append-only) is the load-bearing check: the committed oos_ledger.json
      # must be a *superset* of the base ledger — a holdout consumption can never
      # be removed. It MUST run on both PRs and direct pushes to main.
      #
      # The base ledger is resolved per event type (review follow-up §1.4 / §3.4):
      #   * pull_request → the PR's base branch ref, read via `origin/<ref>`
      #     (the PR checkout has no local `main` branch, so `git show main:...`
      #     — the old approach — fails and was silently swallowed by `|| true`).
      #   * push → the commit *before* this one, `github.event.before`.
      # If no baseline ledger can be obtained the job FAILS (fail closed) rather
      # than skipping the check — the only documented exception is a base branch
      # that predates the ledger file entirely (a genuine bootstrap).
      - name: check the committed results (append-only ledger enforced vs base)
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          LEDGER_REL="strategy/oos_ledger.json"

          resolve_base() {
            # Echoes a git object (branch/commit) that contains the base ledger.
            if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_BRANCH:-}" ]; then
              git fetch --no-tags --depth=1 origin "${BASE_BRANCH}" >/dev/null 2>&1
              git rev-parse -q --verify "origin/${BASE_BRANCH}" >/dev/null \
                || { echo "ERROR: could not fetch origin/${BASE_BRANCH}" >&2; return 1; }
              echo "origin/${BASE_BRANCH}"
            elif [ "${EVENT_NAME}" = "push" ] && [ -n "${BEFORE_SHA:-}" ]; then
              git fetch --no-tags --depth=1 origin "${BEFORE_SHA}" >/dev/null 2>&1 \
                || git fetch --no-tags origin "${BEFORE_SHA}" >/dev/null 2>&1
              git rev-parse -q --verify "${BEFORE_SHA}" >/dev/null \
                || { echo "ERROR: could not fetch base commit ${BEFORE_SHA}" >&2; return 1; }
              echo "${BEFORE_SHA}"
            else
              # No base to diff against for this event (e.g. a brand-new repo).
              return 0
            fi
          }

          # resolve_base: 0 = base resolved (or genuinely none, e.g. first push
          # ever), 1 = a base was expected but could not be fetched. A failure
          # to obtain an *expected* baseline is a hard error (fail closed);
          # only a genuine bootstrap (no baseline on base) may skip L1.
          BASE_OBJ="" ; BASE_RC=0
          BASE_OBJ="$(resolve_base)" || BASE_RC=$?
          if [ "${BASE_RC}" -ne 0 ]; then
            echo "FATAL: the base ledger was expected but could not be obtained." >&2
            echo "Refusing to skip the append-only (L1) check (fail closed)." >&2
            exit 1
          fi
          if [ -n "${BASE_OBJ}" ]; then
            # The base branch may predate the ledger (bootstrap) — that is the
            # only case where an empty baseline is legal.
            if git show "${BASE_OBJ}:${LEDGER_REL}" > base_oos_ledger.json 2>/dev/null \
               && [ -s base_oos_ledger.json ]; then
              echo "Using base ledger from ${BASE_OBJ}"
              python scripts/check_results.py --base-ledger base_oos_ledger.json
            else
              echo "Base ${BASE_OBJ} has no ${LEDGER_REL} (bootstrap — no baseline)"
              python scripts/check_results.py
            fi
          else
            echo "No base ledger available for this event (bootstrap); full check"
            python scripts/check_results.py
          fi

  pytest:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TA-Lib 0.8.2 ships self-contained binary wheels that bundle libta-lib,
      # so no system-level apt package is needed (review 2026-10-29: the apt
      # step failed on Ubuntu 26 where the package name changed).
      - name: install dependencies (pinned)
        # requirements.lock pins every version (review 2026-10-28 §B2), so this
        # job is now deterministic and blocks the merge on a real test failure.
        run: pip install -r requirements.lock

      - name: run the test suite
        run: python -m pytest tests/ -q
