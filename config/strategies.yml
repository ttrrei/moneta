# ---------------------------------------------------------------------------
# Trial log (0.5). Every attempt — including rejected and parked ones — is
# recorded so the cumulative multiple-testing burden is visible. Without this,
# the "best of N" strategy is indistinguishable from luck.
# ---------------------------------------------------------------------------
trial_log:
  file: "strategy/trial_log.md"
  # Every row must include: date, strategy_id, hypothesis (one line), the
  # window used, and the outcome (tested/parked/rejected).
  required_fields:
    - date
    - strategy_id
    - hypothesis
    - window            # "full" | "last_12m" | "oos"
    - outcome
    - n_strategies_tried_before   # running count, for honest "best-of-N" context
