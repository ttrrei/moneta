# Strategy evaluation config — moneta / Nova
#
# This file pins the **evaluation windows** and the **out-of-sample (OOS)
# discipline** so that repeated loop runs remain comparable and do not silently
# overfit (legacy reviews: finding B4 "no fixed window anchor" and the OOS
# gap, BRD §10 #1 risk = overfitting).
#
# Read by:
#   * strategy/WORKFLOW.md (Step 4 window selection, Step 6 OOS gate)
#   * strategy/generated_strategy.md §5 (stop conditions / OOS requirement)
#   * strategy/run_matrix.py and strategy/strategy_rsi_lib.py — both load
#     these values verbatim so the windows cannot drift between runs.

# ---------------------------------------------------------------------------
# Evaluation windows (Step 4). Fixed anchors so every strategy — this run and
# every future run — evaluates the *identical* data spans. This is what makes
# cross-strategy and cross-run comparisons valid (B4).
#
# IMPORTANT (repo_review_20261027 §1.1): in-sample windows are capped with
# `until` at the day before the OOS holdout, so no in-sample run can ever
# tune on holdout data. `oos` is the holdout itself — run exactly once per
# strategy by the runner (one-time lock, see strategy/run_matrix.py).
# ---------------------------------------------------------------------------
windows:
  # "full": all history, but strictly before the holdout.
  full:
    since: null
    until: "2025-07-31"        # day before oos.holdout_start
  # "last_12m": a *fixed* 12-month window anchored to specific dates, NOT
  # "12 months before now". Every strategy references the same anchor (B4).
  # It ends exactly at the holdout boundary so it stays in-sample; the
  # original 2025-10-27 anchor sat *inside* the holdout and had to move.
  last_12m:
    since: "2024-08-01"
    until: "2025-07-31"
  # "oos": the holdout — the single, final, out-of-sample check.
  #
  # Single source of truth for the holdout's END (follow-up review, issue 5):
  #   * `oos.holdout_end` (2026-10-22) is the last fully-closed UTC day.
  #   * `windows.oos.until` is DERIVED from it: until = holdout_end + 1 day
  #     (2026-10-23). The checker (L0) enforces until == holdout_end + 1 day,
  #     so the two can no longer drift apart. Edit `holdout_end` and bump
  #     `until` to the day after — never the other way round.
  #
  # Why "until = holdout_end + 1 day" and not "until = holdout_end": the loader
  # (strategy/strategy_lib.py::load_bars) applies the holdout bound as a
  # **half-open** interval `time < until` (a date-only bound read at UTC
  # midnight, session timezone pinned to UTC). So `time < 2026-10-23 00:00`
  # includes every bar of 2026-10-22 and **excludes** the 2026-10-23 00:00 bar
  # and everything after it. This is the exact "include the last fully-closed
  # day, exclude the partial day" intent — with no extra boundary bar the
  # engine could act on at the next open (follow-up review issue 5 / §1.2).
  # In-sample windows (`full`, `last_12m`) still use the inclusive `time <= until`
  # because their `until` (2025-07-31) is the *last bar's own date*, not the
  # day after it.
  # Since bound: `time >= 2025-08-01` includes every bar from 2025-08-01 00:00.
  # New market data arriving after 2026-10-22 therefore never enters this
  # holdout — it belongs to a future `oos2` window under a new holdout id.
  oos:
    since: "2025-08-01"
    until: "2026-10-23"        # derived: oos.holdout_end (2026-10-22) + 1 day

# ---------------------------------------------------------------------------
# Out-of-sample holdout (0.5 OOS discipline). This span is **never** used for
# hypothesis selection or tuning. It is run ONCE, only for a finalist
# ("tested") strategy, and its result is the only number allowed to decide
# promotion. Iterating against it is data snooping.
# ---------------------------------------------------------------------------
oos:
  # Reserve the most recent ~14 months (2025-08 → holdout_end) as the holdout.
  # Strategies are *discovered and tuned* only on data strictly before
  # `holdout_start`.
  #
  # Identity of THIS holdout (repo_review_20261029 D2). The holdout is a
  # *fixed, closed window* with an explicit id. A holdout is **spent** once
  # one finalist consumes it (see `max_strategies_per_holdout`); any further
  # research needs a *new, unseen* holdout window (later `holdout_start` /
  # `holdout_end`, a new `holdout_id`) — never this one again.
  holdout_id: "oos1"
  holdout_start: "2025-08-01"
  # Last fully-closed UTC day for all 3 instruments at the time of the
  # 2026-10-29 review (2026-10-23 is still partial in both parquets).
  holdout_end: "2026-10-22"
  # D1: how many *distinct strategies* may each consume this holdout.
  # Default 1: once one finalist looks at `oos1`, it is spent for every
  # other strategy. A different number is a one-line change here.
  max_strategies_per_holdout: 1
  # Rule for the workflow (Step 6 / generated_strategy §5): a strategy may only
  # be promoted to `tested` if it ALSO beats buy-hold inside the holdout,
  # evaluated exactly once. Re-running it to improve the holdout number is
  # prohibited (that is re-tuning and must open a new S-NN).
  usage: "finalist_only_once"
  # Adjudication bar — FIXED in advance, before any holdout number is looked
  # at (review 2026-10-28: the pass rule must be decided before the next
  # strategy result is seen, not after). A strategy is promoted to `tested`
  # only if ALL of the following hold on the single holdout evaluation:
  pass_criteria:
    # 1. Cross-market: beats buy-hold at 2 bps on AT LEAST 2 of the 3
    #    instruments. (A single-instrument win is a BTC-beta artifact, not a
    #    strategy — see S-06.)
    min_instruments_beating_bh_at_2bps: 2
    # 2. Risk/scale comparator: on the instruments it wins, the holdout
    #    total-return vs buy-hold must be positive at 2 bps (already required
    #    by #1) — AND the win must not come from taking more net long exposure
    #    than buy-hold. In practice: report the strategy's mean net position
    #    alongside buy-hold's (+100%) so a "win" from doubled leverage is
    #    visible and can be rejected. (No extra metric computed; just reported.)
    comparator: "beat_bh_at_2bps_on_min_2_of_3_instruments; report mean net position for same-exposure sanity"
    # 3. Frequency guard (generated_strategy §5): the holdout run must stay
    #    inside the registered trade-count ceiling, else reject as cost×frequency.
    #    D3: the `> 300 trades` rule in generated_strategy.md §3/§5 is a
    #    full-history-span limit. Converting to a per-year ceiling:
    #      300 trades / (full span 2020-01-03 → 2025-07-31 = 5.574 years)
    #      = 53.8 / year  ->  54 / year.
    #    This applies to **every OOS cell** (all instruments, all cost tiers):
    #    a cell whose trade count exceeds 54 × its window span fails the gate.
    #    Over the OOS span (2025-08-01 → 2026-10-22 = 1.224 years) that is
    #    54 × 1.224 ≈ 66 trades.
    respect_trade_ceiling: true
    max_trades_per_year: 54
    # Rationale for the ">=2 of 3" (not "all 3") bar: all-3 is nearly
    # impossible for long-only strategies and would make every result a
    # "rejected" (the exact failure the review warned about), while 1 of 3 is
    # a single-instrument artifact. 2 of 3 is the defensible middle.
  note: >
    The in-sample window for discovery/tuning is data < holdout_start.
    The holdout is the single, final, out-of-sample check. Recording which
    strategies were tried against it (trial_log) is mandatory.
    The pass_criteria above are the bar for that check; do not change them
    after seeing a holdout number (that is re-tuning the criterion).

# ---------------------------------------------------------------------------
# Strategy registry (config side). Each entry pins what the *runner* must
# enforce before any bar is loaded.
#
# `timeframe` is the bar cadence the strategy is registered on. run_matrix
# refuses to start a strategy on any other timeframe instead of letting it
# silently run on the wrong table (repo_review_20261027 §1.7: S-02 is a 1h
# strategy and the runner defaulted to 5m with no error).
# ---------------------------------------------------------------------------
