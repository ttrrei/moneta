# config/strategy_specs.yml — the declarative strategy catalogue.
#
# A strategy here is DATA, not code. Each entry states:
#
#   hypothesis      the falsifiable claim this strategy trades;
#   expected_trades the prior on opportunity frequency (a range);
#   difference      what makes it distinct from an already-tried idea —
#                   this is the human-readable dedup rationale, and it is
#                   checked against the registry by scripts/check_results.py;
#   family / role / side / horizon
#                   the axes of the hypothesis space. `family` is what keeps
#                   the *distribution* of research balanced (see
#                   docs/REFACTOR_PLAN.md, stage R4); `role` is the regime the
#                   idea is for, which is what makes a later iteration
#                   targeted rather than a blind knob turn.
#
# The condition vocabulary is closed (strategy/rule_spec.py): above, below,
# cross_up, cross_down, cross_above, cross_below. Every condition is causal
# by construction — it compares bar j with bar j-1 at most.
#
# To add a strategy: copy an existing entry, change the hypothesis and the
# conditions, and register it in strategy/STRATEGY_REGISTRY.md. Do NOT add a
# new strategy_*_lib.py file — the shared runner (strategy/strategy_spec_runner.py)
# already knows how to execute anything in this file.
#
# S-113..S-132 were migrated out of strategy/strategy_diverse_lib.py, which
# previously held them as Python literals.

