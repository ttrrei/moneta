limitations:
- 200 related configurations from 50 source feature families, not 200 independent
  primitive indicators
- Round-2 adaptation consumes training only, but validation history is reused development
  data
- Entry-feature scope fixed before its labels after portfolio outcomes were known
- Lower exposure and sparse samples do not establish alpha
- 5610-family artifacts preserved; 6810-family correction saved separately
- Legacy S-series checker excludes experimental namespace; dedicated cohort audits
  cover it
